# ---------------------------------------------------------------------------
# The show registry.
#
# operator:  atg | lw
# key:       your own stable id, used in the database. Once a show has been
#            collected under a key, don't rename it — the history is tied to it.
#
# The ATG entries below were read off atgtickets.com on 23 Aug 2026 and each
# one was checked to return a working calendar before being added here.
# ---------------------------------------------------------------------------

