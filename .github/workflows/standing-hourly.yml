name: Standing places, hourly (ATG)

# Temporary, started 1 Nov 2026: when exactly do Cabaret's, Rent's and Operation
# Mincemeat's standing places go on sale? The daily collection reads them once,
# about 11am, which only says they were on sale by then. This reads today's
# performances every hour, 8am to 7pm UK time, using the committed database's
# list of performances, and appends to data/standing-hourly.csv, which the
# London Theatre Geek admin reads. It commits nothing else, so it can't clash
# with the daily commit of the database. This repo is public, so the minutes
# are free. Delete it once the release times are known.
#
# No schedule here: GitHub's started 4 of about 24 runs over 1-3 Nov. The
# London Theatre Geek database starts it at five past each hour instead
# (pg_cron job-tracker-standing, migration 55, through /api/run-job). Delete
# that timer too when this goes.
on:
  workflow_dispatch: {}

concurrency:
  group: standing-hourly
  cancel-in-progress: false

permissions:
  contents: write   # to commit data/standing-hourly.csv

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Keep only the shows being timed
        run: |
          python - <<'PY'
          import yaml
          d = yaml.safe_load(open('config/shows.yaml', encoding='utf8'))
          shows = d['shows'] if isinstance(d, dict) else d
          keep = [s for s in shows if s['key'] in ('cabaret-playhouse', 'rent-tom-stoppard', 'operation-mincemeat-fortune')]
          yaml.safe_dump({'shows': keep} if isinstance(d, dict) else keep, open('standing-hourly.yaml', 'w', encoding='utf8'), allow_unicode=True)
          PY

      - name: Read today's standing places
        run: python -m wet.cli --shows standing-hourly.yaml standing --days 1 | tee standing-hourly.log

      - name: Save the readings
        run: |
          python scripts/export_standing.py --hourly-log standing-hourly.log
          git config user.name "West End Tracker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/standing-hourly.csv
          git diff --cached --quiet && echo "Nothing new to commit." && exit 0
          git commit -m "Standing readings: $(date -u +%Y-%m-%dT%H:%M)"
          for attempt in 1 2 3; do
            git pull --rebase origin ${GITHUB_REF_NAME} && git push && exit 0
            sleep 15
          done
          exit 1
